version: '3.8'

services:
  redis:
    image: redis:6-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  db:
    image: postgres:13-alpine
    env_file: .env
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-c", "cd src && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]

  celery:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    command: ["sh", "-c", "cd src/medbook && celery -A medbook worker --loglevel=info"]

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume: