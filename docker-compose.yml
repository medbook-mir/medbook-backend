version: '3.8'

services:
  redis:
    image: redis:6-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  db:
    image: postgres:13-alpine
    env_file: .env
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:  
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles 
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-c", "cd src && python manage.py migrate && python manage.py collectstatic --no-input && python manage.py runserver 0.0.0.0:8000"]  # Добавлен collectstatic

  # celery:
  #   build: ./backend
  #   env_file: .env
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     - db
  #     - redis
  #   command: ["sh", "-c", "cd src && celery -A medbook worker --loglevel=info"]

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    environment: 
      - VITE_API_URL=http://localhost:8000  
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume: 