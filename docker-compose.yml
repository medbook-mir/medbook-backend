version: '3.8'

services:
  redis:
    image: redis:6-alpine
    command: redis-server --save 60 1 --loglevel warning --ignore-warnings ARM64-COW-BUG
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
    restart: "on-failure:2"

  db:
    image: postgres:13-alpine
    env_file: .env
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
    restart: "on-failure:2"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DEBUG=${DEBUG:-false}
      - SERVICE_TYPE=backend
    volumes:
      - ./backend:/app
      - static_volume:/app/src/staticfiles
    ports:
      - "8000:8000"
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["sh", "/app/entrypoint.sh"]
    restart: "on-failure:2"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DEBUG=${DEBUG:-false}
      - SERVICE_TYPE=api
    volumes:
      - ./backend:/app
      - static_volume:/app/src/staticfiles
    ports:
      - "8001:8000"
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["sh", "/app/entrypoint.sh"]
    restart: "on-failure:2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - VITE_API_URL=http://backend:8000
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - app_network
    depends_on:
      - backend
    restart: "on-failure:2"

  minio:
    image: minio/minio:latest
    container_name: medbook-minio
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 2
    networks:
      - app_network

  minio-init:
    image: minio/mc:latest
    env_file: .env
    environment:
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend/init-minio.sh:/init-minio.sh
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - app_network
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  minio_data:

networks:
  app_network:
    driver: bridge