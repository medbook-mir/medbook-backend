name: Manual Deploy to Render

on:
  issue_comment:
    types: [created]

permissions:
  issues: read
  pull-requests: read

jobs:
  manual_deploy:
    if: |
      github.event.issue.pull_request && contains(github.event.comment.body, 'deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Debug context
        run: |
          echo "Triggered by comment: ${{ github.event.comment.body }}"
          echo "Issue URL: ${{ github.event.issue.html_url }}"
          echo "User login: ${{ github.event.comment.user.login }}"

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_PROD_BACKEND_ID }}?key=${{ secrets.RENDER_DH_BACKEND }}"
