name: Manual Deploy to Render

permissions:
  contents: read
  pull-requests: read

on:
  issue_comment:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/deploy')

    steps:
      - name: Debug
        run: |
          echo "Комментарий: '${{ github.event.comment.body }}'"
          echo "Это PR? ${{ github.event.issue.pull_request }}"

      - name: Получить ветку из PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("head_branch", pr.data.head.ref);

      - name: Запустить деплой на Render
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_TEST_BACKEND_ID: ${{ secrets.RENDER_TEST_BACKEND_ID }}
          BRANCH: ${{ steps.pr.outputs.head_branch }} 
        run: |
          echo "Деплою ветку: $BRANCH"
          response=$(curl -s -X POST https://api.render.com/v1/services/$RENDER_TEST_BACKEND_ID/deploys \
            -H "Authorization: Bearer $RENDER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch":"'"$BRANCH"'"}')
          
          echo "Ответ Render: $response"
          if [[ "$response" != *"status"* ]]; then
            echo " Ошибка деплоя!"
            exit 1
          fi
