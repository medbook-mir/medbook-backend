name: Manual Deploy to Render

on:
  issue_comment:
    types: [created]

jobs:
  manual_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show received comment
        run: |
          echo "Comment: '${{ github.event.comment.body }}'"

      - name: Check comment and Deploy
        run: |
          COMMENT="${{ github.event.comment.body }}"
          # Удаляем пробелы в начале и конце, делаем строчные буквы
          NORMALIZED=$(echo "$COMMENT" | xargs | tr '[:upper:]' '[:lower:]')

          echo "Normalized comment: '$NORMALIZED'"

          if [ "$NORMALIZED" = "deploy" ]; then
            echo "Triggering deploy to Render..."
            curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_PROD_BACKEND_ID }}?key=${{ secrets.RENDER_DH_BACKEND }}"
          else
            echo "Comment is not 'deploy'. Skipping deploy."
          fi
