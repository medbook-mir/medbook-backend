name: Manual Deploy to Render

on:
  issue_comment:
    types: [created]

jobs:
  manual_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check comment and Deploy
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NORMALIZED=$(echo "$COMMENT" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')

          echo "Received comment: $COMMENT"
          echo "Normalized comment: $NORMALIZED"

          if [ "$NORMALIZED" = "deploy" ]; then
            echo "Triggering deploy to Render..."
            curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_PROD_BACKEND_ID }}?key=${{ secrets.RENDER_DH_BACKEND }}"
          else
            echo "Comment is not exactly 'deploy'. Skipping deploy."
          fi
