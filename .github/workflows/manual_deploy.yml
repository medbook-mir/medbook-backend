name: Manual Deploy to Render

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  manual_deploy:
    if: contains(github.event.comment.body, '/deploy') && github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("head_branch", pr.data.head.ref);

      - name: Deploy to Render with Branch
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BRANCH: ${{ steps.pr.outputs.head_branch }}
        run: |
          echo "Deploying branch $BRANCH"
          curl -X POST https://api.render.com/v1/services/$SERVICE_ID/deploys \
          -H "Authorization: Bearer $RENDER_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"branch":"'"$BRANCH"'"}'
