name: Django Production CI/CD Pipeline

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target:
        description: 'Select environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

jobs:
  setup_and_test:
    runs-on: ubuntu-latest
    
    # ... (остальные шаги как в test.yml) ...

  deploy_prod_environment:
    needs: setup_and_test
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, 'deploy prod')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Determine services
        id: determine_services
        run: |
          SERVICES="${{ secrets.RENDER_PROD_BACKEND_ID }}"
          echo "services=${SERVICES}" >> $GITHUB_OUTPUT

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          for service in ${{ steps.determine_services.outputs.services }}; do
            echo "Deploying service $service"
            curl -s -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear"}' || echo "Deploy failed for $service"
          done

      - name: Post comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ' Продакшен деплой запущен!'
            })