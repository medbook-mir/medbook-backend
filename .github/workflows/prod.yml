name: Production Deployment

on:
  push:
    branches: [master]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

env:
  DJANGO_SETTINGS_MODULE: "medbook.settings.production"
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run security checks
        working-directory: ./backend/src
        run: |
          python manage.py check --deploy

  deploy_prod:
    needs: verify
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, 'deploy prod') &&
       contains(fromJson('["admin1", "admin2"]'), github.event.comment.user.login)) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: ${{ secrets.RENDER_PROD_BACKEND_ID }}
          API_ID: ${{ secrets.RENDER_PROD_API_ID }}
          FRONTEND_ID: ${{ secrets.RENDER_PROD_FRONTEND_ID }}
        run: |
          services=($BACKEND_ID $API_ID $FRONTEND_ID)
          for service in "${services[@]}"; do
            echo "Deploying $service to production"
            curl -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear", "commitSha": "${{ steps.commit.outputs.sha }}"}'
          done

      - name: Post deploy notification
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Production deploy completed!\n' +
                    'Commit: `' + process.env.SHA + '`\n' +
                    'Deployed by: @' + context.payload.comment.user.login
            })