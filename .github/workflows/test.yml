name: Django CI/CD with Test/Prod Environments

on:
  push:
    branches: [ "master" ]  
  pull_request:
    branches: [ "master" ]  
  workflow_dispatch:      

env:
  DJANGO_SETTINGS_MODULE: "medbook.settings.${{ github.event_name == 'pull_request' && 'test' || 'production' }}"
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: "test_db"  # Всегда тестируем на test_db для PR
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports: ["5432:5432"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: pip install -r backend/requirements.txt
    
    - name: Run tests
      working-directory: ./backend/src
      run: |
        python manage.py migrate
        pytest

  deploy_test: 
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to TEST
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        BACKEND_SERVICE_ID: ${{ secrets.RENDER_TEST_BACKEND_ID }}
        FRONTEND_SERVICE_ID: ${{ secrets.RENDER_TEST_FRONTEND_ID }}
        API_SERVICE_ID: ${{ secrets.RENDER_TEST_API_ID }}
      run: |
        # Деплой всех тестовых сервисов
        for service in $BACKEND_SERVICE_ID $API_SERVICE_ID $FRONTEND_SERVICE_ID; do
          curl -X POST "https://api.render.com/v1/services/$service/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}'
        done
        echo "Тестовые сервисы обновлены!"

  deploy_prod: 
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to PRODUCTION
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        BACKEND_SERVICE_ID: ${{ secrets.RENDER_PROD_BACKEND_ID }}
        FRONTEND_SERVICE_ID: ${{ secrets.RENDER_PROD_FRONTEND_ID }}
        API_SERVICE_ID: ${{ secrets.RENDER_PROD_API_ID }}
      run: |
        # Деплой всех прод-сервисов
        for service in $BACKEND_SERVICE_ID $API_SERVICE_ID $FRONTEND_SERVICE_ID; do
          curl -X POST "https://api.render.com/v1/services/$service/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}'
        done
        echo "Продакшен-сервисы обновлены!"