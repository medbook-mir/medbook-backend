name: Django CI with pytest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:  # The service name is 'postgres' in GitHub Actions
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: medbook_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbook_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost  # Connect via localhost since we're port forwarding
      POSTGRES_DB: test_db
      POSTGRES_USER: medbook_user
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: medbook.settings
      SECRET_KEY: test
      DEBUG: true

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install psycopg2-binary

    - name: Wait for PostgreSQL to be ready
      run: |
        timeout 20s bash -c 'until pg_isready -h localhost -p 5432 -U medbook_user; do sleep 1; done'
        echo "PostgreSQL is ready!"
    
    - name: Run migrations
      run: |
        cd backend/src  
        python manage.py migrate

    - name: Run tests with pytest
      run: |
        cd backend
        pytest