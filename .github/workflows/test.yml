name: Test Environment Deployment

on:
  pull_request:
    branches: [master]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - preview

env:
  DJANGO_SETTINGS_MODULE: "medbook.settings.test"
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test_database_edai?sslmode=disable
  PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

jobs:
  setup_and_test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_database_edai
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref || 'master' }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary pytest-django

      - name: Wait for PostgreSQL
        run: |
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U ${{ secrets.TEST_DB_USER }} -d test_database_edai; do sleep 1; done'

      - name: Run migrations
        working-directory: ./backend/src
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        working-directory: ./backend/src
        run: |
          pytest

  deploy_test:
    needs: setup_and_test
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test') ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, 'deploy test'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref || 'master' }}

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              branch: pr.data.head.ref,
              sha: pr.data.head.sha,
              pr_number: context.issue.number
            };

      - name: Deploy services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: ${{ secrets.RENDER_TEST_BACKEND_ID }}
          API_ID: ${{ secrets.RENDER_TEST_API_ID }}
          FRONTEND_ID: ${{ secrets.RENDER_TEST_FRONTEND_ID }}
        run: |
          services=($BACKEND_ID $API_ID $FRONTEND_ID)
          for service in "${services[@]}"; do
            echo "Deploying service $service"
            curl -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear", "commitSha": "${{ steps.pr-info.outputs.sha }}"}'
          done

      - name: Post comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` Test deploy for PR #${{ steps.pr-info.outputs.pr_number }}\n` +
                    `Services: backend, api, frontend\n` +
                    `Commit: ${process.env.SHA}`
            })

  create_preview:
    needs: setup_and_test
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, 'deploy preview')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.issue.pull_request.head.ref }}

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              pr_number: context.issue.number,
              sha: pr.data.head.sha
            };

      - name: Trigger preview deployments
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: ${{ secrets.RENDER_TEST_BACKEND_ID }}
          API_ID: ${{ secrets.RENDER_TEST_API_ID }}
          FRONTEND_ID: ${{ secrets.RENDER_TEST_FRONTEND_ID }}
        run: |
          services=($BACKEND_ID $API_ID $FRONTEND_ID)
          for service in "${services[@]}"; do
            echo "Creating preview for service $service"
            curl -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "pullRequestId": "${{ steps.pr-info.outputs.pr_number }}",
                "clearCache": "clear",
                "commitSha": "${{ steps.pr-info.outputs.sha }}"
              }'
          done

      - name: Post preview URLs
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` Preview environments created for PR #${{ steps.pr-info.outputs.pr_number }}\n\n` +
                    `🔹 Backend: https://medbook-backend-pr-${{ steps.pr-info.outputs.pr_number }}.onrender.com\n` +
                    `🔹 API: https://medbook-api-pr-${{ steps.pr-info.outputs.pr_number }}.onrender.com\n` +
                    `🔹 Frontend: https://medbook-frontend-pr-${{ steps.pr-info.outputs.pr_number }}.onrender.com\n\n` +
                    `Commit: \`${{ steps.pr-info.outputs.sha }}\``
            })