name: Django Test CI/CD Pipeline

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target:
        description: 'Select environment to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test

env:
  DJANGO_SETTINGS_MODULE: "medbook.settings.test"
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  setup_and_test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_database_edai
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary pytest-django

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U ${{ secrets.TEST_DB_USER }} -d test_database_edai; do sleep 1; done'

      - name: Run migrations
        working-directory: ./backend/src
        env:
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test_database_edai?sslmode=disable
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        working-directory: ./backend/src
        run: |
          pytest

  deploy_test_environment:
    needs: setup_and_test
    if: |
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       contains(github.event.comment.body, 'deploy test')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Determine services
        id: determine_services
        run: |
          SERVICES="${{ secrets.RENDER_TEST_BACKEND_ID }}"
          echo "services=${SERVICES}" >> $GITHUB_OUTPUT

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          for service in ${{ steps.determine_services.outputs.services }}; do
            echo "Deploying service $service"
            curl -s -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear"}' || echo "Deploy failed for $service"
          done

      - name: Post comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Тестовый деплой запущен!'
            })