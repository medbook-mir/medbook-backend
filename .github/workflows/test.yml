name: Django Test CI/CD Pipeline

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      target:
        description: 'Select environment to deploy'
        required: true
        default: 'test'
        type: choice
        options:
          - test

env:
  DJANGO_SETTINGS_MODULE: "medbook.settings.test"
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/test_database_edai
  PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

jobs:
  setup_and_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_database_edai
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary pytest-django dj-database-url

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U ${{ secrets.TEST_DB_USER }} -d test_database_edai; do sleep 1; done'
          echo "PostgreSQL is ready!"

      - name: Verify DB connection
        run: |
          psql -h localhost -p 5432 -U ${{ secrets.TEST_DB_USER }} -d test_database_edai -c "SELECT 1;"

      - name: Debug database settings
        working-directory: ./backend/src
        run: |
          python -c "import os; import django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'medbook.settings.test'); django.setup(); from django.conf import settings; print('🔧 DATABASES:', settings.DATABASES)"

      - name: Run migrations
        working-directory: ./backend/src
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        working-directory: ./backend/src
        run: |
          pytest --reuse-db -v --capture=no

  deploy_test_environment:
    needs: setup_and_test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Test Environment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICES: "${{ secrets.RENDER_TEST_BACKEND_ID }} ${{ secrets.RENDER_TEST_API_ID }} ${{ secrets.RENDER_TEST_FRONTEND_ID }}"
        run: |
          for service in $SERVICES; do
            echo "Deploying service $service"
            curl -s -X POST "https://api.render.com/v1/services/$service/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear"}' || echo "Deploy failed for $service"
          done
          echo "Test environment deployment completed"
