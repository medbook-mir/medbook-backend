name: Django CI/CD with Render

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Select environment to deploy"
        options:
          - staging
          - production
        required: true
        default: staging

env:
  PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
  TEST_DB_URL: ${{ secrets.TEST_DB_URL }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_PROD_SERVICE_ID: ${{ secrets.RENDER_PROD_SERVICE_ID }}
  RENDER_TEST_SERVICE_ID: ${{ secrets.RENDER_TEST_SERVICE_ID }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: ['test_db', 'prod_db']
      fail-fast: false

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "sh -c 'pg_isready -U \"$POSTGRES_USER\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt
        pip install psycopg2-binary pytest-django

    - name: Run tests
      env:
        DATABASE_URL: ${{ matrix.db == 'prod_db' && secrets.PROD_DB_URL || secrets.TEST_DB_URL }}
        DJANGO_SETTINGS_MODULE: ${{ matrix.db == 'prod_db' && 'myproject.settings.production' || 'myproject.settings.test' }}
      run: |
        echo "Running tests for ${{ matrix.db }}"
        cd backend/src
        python manage.py migrate
        pytest backend/src/tests

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Render
      run: |
        if [ "${{ github.event.inputs.environment }}" = "production" ]; then
          SERVICE_ID="${{ secrets.RENDER_PROD_SERVICE_ID }}"
        else
          SERVICE_ID="${{ secrets.RENDER_TEST_SERVICE_ID }}"
        fi

        response=$(curl -s -o response.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": true}')

        if [ "$response" -ne 200 ]; then
          echo "Deployment failed with status $response"
          cat response.json
          exit 1
        fi

        echo "Deployment triggered successfully"
