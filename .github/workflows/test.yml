name: Django CI with pytest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: medbook_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbook_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: test_db
      POSTGRES_USER: medbook_user
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: medbook.settings.production
      SECRET_KEY: test-secret-key-123
      DEBUG: "false" 
      DATABASE_URL: postgres://medbook_user:password@localhost:5432/test_db

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install psycopg2-binary pytest-django python-dotenv

    - name: Wait for services to be ready
      run: |
        timeout 20s bash -c 'until pg_isready -h localhost -p 5432 -U medbook_user; do sleep 1; done'
        timeout 10s bash -c 'until redis-cli -h localhost ping | grep -q "PONG"; do sleep 1; done'
        echo "All services are ready!"
    
    - name: Run migrations
      working-directory: ./backend/src
      run: |
        python manage.py migrate --no-input

    - name: Run tests with pytest
      working-directory: ./backend/src
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest --cov=.